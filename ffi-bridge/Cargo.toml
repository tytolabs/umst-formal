[package]
name = "umst-ffi-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Santhosh Shyamsundar", "Santosh Prabhu Shenbagamoorthy"]
description = "Material-agnostic C-ABI thermodynamic gate (manifold + umst-math)."
license = "MIT"

[dependencies]
# W-62: pinned public git siblings (monorepo may patch via workspace-root .cargo).
umst-manifold = { version = "0.1.0", git = "https://github.com/tytolabs/umst-manifold.git", rev = "ce9828ea5a8c3ced0a350da648a4c5f336fec0fb", default-features = false, features = ["ndarray"] }
umst-math = { version = "0.1.0", git = "https://github.com/tytolabs/umst-manifold.git", rev = "ce9828ea5a8c3ced0a350da648a4c5f336fec0fb", package = "umst-math" }
# Unify transitive ordered-float (manifold pulls 5.5 / rustc 1.90); root census uses 1.88.
ordered-float = { version = "=5.4.0" }
[lib]
name = "umst_ffi"
# rlib is required for integration tests (tests/ directory).
# cdylib/staticlib are for Haskell and OCaml consumers respectively.
crate-type = ["rlib", "cdylib", "staticlib"]

[[test]]
name = "integration"
path = "tests/integration.rs"