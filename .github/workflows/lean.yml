# CI: Lake + Mathlib (cache when available). See Lean/VERIFY.md.
name: Lean
on:
  workflow_dispatch:
  push:
    branches: [main, master, docs/reorganize-readme]
    paths:
      - "Lean/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "Lean/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/lean.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lean 4 proof check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4

      - name: No ignored build artefacts are tracked
        run: bash scripts/check_tracked_build_artefacts.sh

      - name: Set up Lean 4 + Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: auto

      - name: Every tracked Lean file is compiled by a default target (or listed with a reason)
        run: python3 scripts/check_lean_ci_closure.py

      - name: Build every library (zero errors, warnings, sorry; manifest current)
        working-directory: Lean
        run: |
          set -eo pipefail
          lake build 2>&1 | tee lake-build.log
          if grep -q "manifest out of date" lake-build.log; then
            echo "FAIL: lakefile and lake-manifest.json disagree on a dependency revision"; exit 1
          fi
          project=$(grep -E "^(warning|error): " lake-build.log | grep -v "\.lake/packages" | grep -v "has local changes" || true)
          if [ -n "$project" ]; then
            echo "FAIL: project diagnostics (zero warnings is the bar):"; echo "$project"; exit 1
          fi

      - name: Negative regression - the universal second-law discharge must not elaborate
        working-directory: Lean
        run: |
          if lake env lean tests/AxiomProbe.lean > axiom-probe.log 2>&1; then
            echo "FAIL: tests/AxiomProbe.lean elaborated; the universal discharge of the law is back"; exit 1
          fi
          grep -q "physicalSecondLaw_uniform_binary" axiom-probe.log
          echo "OK: AxiomProbe fails as required"

      - name: No tactic sorry/admit in Lean sources
        run: bash scripts/check_lean_sorry.sh

      - name: Axiom hygiene (the law is the SecondLaw predicate; no project axiom)
        run: python3 scripts/check_lean_axioms.py

      - name: Lean declaration counts match committed snapshot
        run: python3 scripts/lean_declaration_stats.py --verify-snapshot scripts/expected_lean_declaration_snapshot.json

      - name: Constants modules and README table match constants/constants.json
        run: python3 scripts/gen_constants.py --check

      - name: Cartridge-anchor axiom baseline (Mathlib closure)
        run: bash scripts/check_print_axioms.sh

      - name: Checkout sibling umst-formal-double-slit (shared-module drift)
        uses: actions/checkout@v4 # v4
        with:
          repository: tytolabs/umst-formal-double-slit
          ref: main
          path: sibling/umst-formal-double-slit

      - name: Single-source Lean modules (no sibling copy of the law)
        env:
          UMST_FORMAL_SIBLING_DIR: ${{ github.workspace }}/sibling/umst-formal-double-slit
        run: bash scripts/check_shared_lean_drift.sh
