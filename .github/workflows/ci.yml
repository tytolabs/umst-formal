name: CI

on:
  push:
    branches: [main, master, docs/reorganize-readme]
  pull_request:
    branches: [main, master, docs/reorganize-readme]

# Cancel in-progress runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Rust FFI bridge depends on umst-prototype-2a/prototype/src/rust/core
# (a sibling repository).  In CI, set UMST_PROTO_REPO to the full GitHub
# URL of that repository, e.g.:
#   https://github.com/<org>/umst-prototype-2a
# The rust-ffi job clones it at the expected relative path.
env:
  UMST_PROTO_REPO: ${{ vars.UMST_PROTO_REPO || '' }}

jobs:
  readme-sanity:
    name: README sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - name: README sanity (catch accidental wipes)
        run: |
          set -euo pipefail
          lines=$(wc -l < README.md)
          if [ "$lines" -lt 20 ]; then
            echo "FAIL: README.md is suspiciously short ($lines lines)"
            exit 1
          fi
          echo "OK: README.md has $lines lines"
      - name: No ignored build artefacts are tracked
        run: bash scripts/check_tracked_build_artefacts.sh

  # ── Agda + Coq (one definition, in formal.yml) ─────────────────────
  formal:
    name: Formal
    uses: ./.github/workflows/formal.yml

  # ── Haskell (one definition, in haskell.yml) ───────────────────────
  haskell:
    name: Haskell
    uses: ./.github/workflows/haskell.yml

  # ── Rust FFI bridge (W-62: pinned git deps on umst-manifold @ ce9828ea) ─────
  rust-ffi:
    name: Rust FFI bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ffi-bridge/target
          key: ${{ runner.os }}-cargo-ffi-${{ hashFiles('Cargo.lock', 'ffi-bridge/Cargo.toml') }}

      - name: Check formatting
        working-directory: ffi-bridge
        run: cargo fmt --check

      - name: Build ffi-bridge (docs scaffold; clippy advisory only on main)
        working-directory: ffi-bridge
        run: cargo build --all-targets

      - name: Run integration tests
        working-directory: ffi-bridge
        run: cargo test --test integration

      - name: Constants crate formatting (generated from constants/constants.json)
        working-directory: constants-rs
        run: cargo fmt --check

      - name: Constants crate lints
        working-directory: constants-rs
        run: cargo clippy --all-targets -- -D warnings

      - name: Constants crate tests (derived rows follow their formulas)
        working-directory: constants-rs
        run: cargo test

  # ── Visuals script (optional matplotlib; stub OK if deps missing) ─
  visuals:
    name: Generate visuals (fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install visuals dependencies
        run: pip install -r requirements-visuals.txt

      - name: Run generate_visuals.py
        run: python3 scripts/generate_visuals.py

  # ── Lean 4 type-checking ───────────────────────────────────────────
  #
  # Checks all `lakefile.lean` UMST roots with lake build.
  # Uses the Lean version pinned in Lean/lean-toolchain.
  # Mathlib cache via leanprover/lean-action (lean4-action repo was removed).
  lean:
    name: Lean 4 proof check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4

      - name: Set up Lean 4 + Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: auto

      - name: Every tracked Lean file is compiled by a default target (or listed with a reason)
        run: python3 scripts/check_lean_ci_closure.py

      - name: Build every library (zero errors, warnings, sorry; manifest current)
        working-directory: Lean
        run: |
          set -eo pipefail
          lake build 2>&1 | tee lake-build.log
          if grep -q "manifest out of date" lake-build.log; then
            echo "FAIL: lakefile and lake-manifest.json disagree on a dependency revision"; exit 1
          fi
          project=$(grep -E "^(warning|error): " lake-build.log | grep -v "\.lake/packages" | grep -v "has local changes" || true)
          if [ -n "$project" ]; then
            echo "FAIL: project diagnostics (zero warnings is the bar):"; echo "$project"; exit 1
          fi

      - name: Negative regression - the universal second-law discharge must not elaborate
        working-directory: Lean
        run: |
          if lake env lean tests/AxiomProbe.lean > axiom-probe.log 2>&1; then
            echo "FAIL: tests/AxiomProbe.lean elaborated; the universal discharge of the law is back"; exit 1
          fi
          grep -q "physicalSecondLaw_uniform_binary" axiom-probe.log
          echo "OK: AxiomProbe fails as required"

      - name: No tactic sorry/admit in Lean sources
        run: bash scripts/check_lean_sorry.sh

      - name: Axiom hygiene (the law is the SecondLaw predicate; no project axiom)
        run: python3 scripts/check_lean_axioms.py

      - name: Lean declaration counts match committed snapshot
        run: python3 scripts/lean_declaration_stats.py --verify-snapshot scripts/expected_lean_declaration_snapshot.json

      - name: Constants modules and README table match constants/constants.json
        run: python3 scripts/gen_constants.py --check

      - name: Four-language parity of the contract (formal_parity.json)
        run: python3 scripts/check_formal_parity.py --summary

      - name: Wording matches the formal state (no axiom; physicalSecondLaw is the erase instance)
        run: python3 scripts/check_stale_wording.py

      - name: Lean catalog describes the tracked sources (pins check against it)
        run: python3 scripts/check_catalog_fresh.py

      - name: No theatre in the Lean tree (literal, reflexive, alias, duplicate, definitional, trivial, table, bundle)
        run: python3 scripts/theatre_census.py --check 0

      - name: Cartridge-anchor axiom baseline (Mathlib closure)
        run: bash scripts/check_print_axioms.sh

      - name: Checkout sibling umst-formal-double-slit (shared-module drift)
        uses: actions/checkout@v4 # v4
        with:
          repository: tytolabs/umst-formal-double-slit
          ref: main
          path: sibling/umst-formal-double-slit

      - name: Single-source Lean modules (no sibling copy of the law)
        env:
          UMST_FORMAL_SIBLING_DIR: ${{ github.workspace }}/sibling/umst-formal-double-slit
        run: bash scripts/check_shared_lean_drift.sh

  # ── Markdown / docs lint ───────────────────────────────────────────
  docs:
    name: Docs lint + Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown files
        run: |
          markdownlint \
            README.md \
            CONTRIBUTING.md \
            CHANGELOG.md \
            Agda/README.md \
            Coq/README.md \
            Haskell/README.md \
            Docs/Architecture-Invariants.md \
            --config .markdownlint.json

      - name: Check Markdown links (curated corpus)
        run: bash scripts/check-markdown-links.sh
