# Haskell QuickCheck mirror — see Haskell/README.md
name: Haskell
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, master, docs/reorganize-readme]
    paths:
      - "Haskell/**"
      - ".github/workflows/haskell.yml"
  pull_request:
    paths:
      - "Haskell/**"
      - ".github/workflows/haskell.yml"

concurrency:
  # suffix keeps runs called from CI (ci.yml) from sharing, and cancelling, one group
  group: ${{ github.workflow }}-haskell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cabal-test:
    name: Haskell pure gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4

      - uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2
        with:
          ghc-version: "9.6"
          cabal-version: "3.10"

      - name: Cache cabal store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-cabal-${{ hashFiles('Haskell/umst-formal.cabal') }}
          restore-keys: ${{ runner.os }}-cabal-

      - name: Update package index
        run: cabal update

      - name: Every tracked Haskell module is in the cabal file
        working-directory: Haskell
        run: |
          set -euo pipefail
          missing=""
          for f in $(git ls-files '*.hs' | grep -v '^test/\|^tools/\|^FFI.hs$'); do
            m=$(echo "${f%.hs}" | tr / .)
            grep -qE "^\s+$m\s*$" umst-formal.cabal || missing="$missing $f"
          done
          for f in $(git ls-files 'test/*.hs'); do
            b=$(basename "${f%.hs}")
            grep -qE "(main-is:\s+(test/)?$b\.hs|other-modules:.*\b$b\b)" umst-formal.cabal || missing="$missing $f"
          done
          if [ -n "$missing" ]; then echo "FAIL: not built by any cabal component:$missing"; exit 1; fi
          echo "OK: every tracked .hs is built"

      - name: Build library and test suites, warnings are errors (FFI disabled)
        working-directory: Haskell
        # -f -with-ffi: build WITHOUT the FFI flag → no Rust dep, no linker error
        run: cabal build all -f -with-ffi --ghc-options=-Werror

      - name: Run every test suite (a falsified or abandoned property fails the run)
        working-directory: Haskell
        run: |
          cabal test all \
            -f -with-ffi \
            --test-show-details=streaming \
            --test-option=--qc-max-success=500
